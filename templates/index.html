<!DOCTYPE html>
<html>
<head>
    <title>PDF → Video Converter</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #7F7FD5, #86A8E7, #91EAE4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }

        small {
            color: gray;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        textarea {
            resize: none;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: #4facfe;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .progress {
            width: 100%;
            background: #eee;
            margin-top: 10px;
            border-radius: 5px;
        }

        .progress-bar {
            width: 0%;
            height: 20px;
            background: #00c6ff;
            text-align: center;
            color: white;
            border-radius: 5px;
        }

        video {
            width: 100%;
            margin-top: 10px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 10px;
            padding: 10px;
            background: green;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>PDF → Video Converter</h2>

    <!-- Images -->
    <label>Select Images</label>
    <input type="file" id="images" name="file" multiple>

    <!-- Default duration -->
    <label>⏱ Seconds per Slide</label>
    <small>Default duration for each slide</small>
    <input type="number" id="default_duration" value="3">

    <!-- Custom duration -->
    <label>⚙ Custom Durations</label>
    <small>Example: 2,3,4 (optional)</small>
    <input type="text" id="durations" name="durations" placeholder="4,5,6">

    <!-- Narration -->
    <label>🎤 Narration</label>
    <small>Optional text-to-speech</small>
    <textarea id="narration" name="narration">hi my name is sanskruti</textarea>

    <!-- Audio -->
    <label>🎵 Background Audio</label>
    <small>Optional music file</small>
    <input type="file" id="audio" name="audio">

    <button onclick="startProcess()">✨ Create Video</button>

    <div class="progress">
        <div id="bar" class="progress-bar">0%</div>
    </div>

    <p id="status" style="text-align:center;">Generating video...</p>

    <video id="video" controls></video>

    <a id="download" href="/download" style="display:none;">⬇ Download Video</a>
</div>

<script>
function startProcess() {
    const files = document.getElementById("images").files;
    const narration = document.getElementById("narration").value;
    const durations = document.getElementById("durations").value;
    const default_duration = document.getElementById("default_duration").value;
    const audio = document.getElementById("audio").files[0];

    let formData = new FormData();

    for (let i = 0; i < files.length; i++) {
        formData.append("file", files[i]);
    }

    formData.append("narration", narration);
    formData.append("durations", durations);
    formData.append("default_duration", default_duration);

    if (audio) {
        formData.append("audio", audio);
    }

    fetch("/start", {
        method: "POST",
        body: formData
    });

    let interval = setInterval(() => {
        fetch("/progress")
        .then(res => res.json())
        .then(data => {
            let bar = document.getElementById("bar");
            bar.style.width = data.progress + "%";
            bar.innerText = data.progress + "%";

            if (data.progress >= 100) {
                clearInterval(interval);
                document.getElementById("download").style.display = "block";
                document.getElementById("video").src = "/download";
            }
        });
    }, 1000);
}
</script>

</body>
</html>
