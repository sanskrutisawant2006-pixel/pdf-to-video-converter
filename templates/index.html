<!DOCTYPE html>
<html>
<head>
    <title>PDF to Video Converter</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4facfe;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .progress-bar {
            width: 100%;
            background: #eee;
            border-radius: 5px;
            margin-top: 10px;
        }

        .progress {
            width: 0%;
            height: 20px;
            background: #00c6ff;
            text-align: center;
            color: white;
            border-radius: 5px;
        }

        video {
            width: 100%;
            margin-top: 10px;
        }

        .download-btn {
            background: #28a745;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>PDF → Video Converter</h2>

    <form id="form">
        <label>Select Images:</label><br>
        <input type="file" name="file" multiple required><br><br>

        <label>Narration:</label><br>
        <textarea name="narration" placeholder="Enter text..."></textarea><br><br>

        <label>Background Audio:</label><br>
        <input type="file" name="audio"><br><br>

        <button type="submit">✨ Create Video</button>
    </form>

    <div class="progress-bar">
        <div class="progress" id="progress">0%</div>
    </div>

    <p id="status"></p>

    <video id="video" controls></video>

    <a id="download" href="/download">
        <button class="download-btn">⬇ Download Video</button>
    </a>
</div>

<script>
    const form = document.getElementById("form");
    const progressBar = document.getElementById("progress");
    const status = document.getElementById("status");
    const video = document.getElementById("video");

    form.addEventListener("submit", function(e) {
        e.preventDefault();

        const formData = new FormData(form);

        fetch("/start", {
            method: "POST",
            body: formData
        }).then(() => {
            checkProgress();
        });
    });

    function checkProgress() {
        let interval = setInterval(() => {
            fetch("/progress")
            .then(res => res.json())
            .then(data => {
                progressBar.style.width = data.value + "%";
                progressBar.innerHTML = data.value + "%";

                if (data.value === 100) {
                    clearInterval(interval);
                    status.innerHTML = "Video ready!";
                    
                    video.src = data.video + "?t=" + new Date().getTime();
                }
            });
        }, 1000);
    }
</script>

</body>
</html>
</html>
