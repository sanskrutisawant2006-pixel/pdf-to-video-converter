<!DOCTYPE html>
<html>
<head>
<title>PDF → Video Converter</title>

<style>
body {
    text-align: center;
    font-family: Arial;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
}

.container {
    background: white;
    color: black;
    width: 420px;
    margin: 40px auto;
    padding: 20px;
    border-radius: 12px;
}

input, textarea {
    width: 90%;
    padding: 8px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    padding: 10px;
    width: 95%;
    background: linear-gradient(45deg, #4facfe, #00f2fe);
    border: none;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

#loader {
    display: none;
    position: fixed;
    z-index: 999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: #0f172a;
    color: white;
}

.spinner {
    margin: 200px auto;
}

video {
    margin-top: 20px;
    width: 90%;
}
</style>

<script>
function showLoader() {
    document.getElementById("loader").style.display = "block";

    let width = 0;
    let interval = setInterval(() => {
        if (width >= 90) {
            clearInterval(interval);
        } else {
            width += 5;
            document.getElementById("progressBar").style.width = width + "%";
            document.getElementById("progressText").innerText = width + "%";
        }
    }, 400);
}
</script>

</head>

<body>

<h1>🚀 PDF → Video Converter</h1>

<div class="container">

<form method="POST" enctype="multipart/form-data" onsubmit="showLoader()">

<p>📄 Upload PDF</p>
<input type="file" name="pdf" required>

<p>⏱ Seconds per slide</p>
<input type="number" name="duration" value="3">

<p>⚙ Custom durations</p>
<input type="text" name="custom_durations" placeholder="2,3,4">

<p>🎤 Narration</p>
<textarea name="narration" placeholder="Enter narration..."></textarea>

<p>🎵 Background Audio</p>
<input type="file" name="audio">

<br>
<button type="submit">✨ Create Video</button>

</form>

{% if message %}
<h2>{{ message }}</h2>

<video controls>
    <source src="{{ url_for('static', filename=video) }}" type="video/mp4">
</video>
{% endif %}

</div>

<!-- LOADER -->
<div id="loader">
    <h2>Processing Video... ⏳</h2>

    <div style="width: 80%; margin: auto; background: #333; border-radius: 10px;">
        <div id="progressBar" style="
            width: 0%;
            height: 20px;
            background: #00c6ff;
            border-radius: 10px;">
        </div>
    </div>

    <p id="progressText">Starting...</p>
</div>

</body>
</html>
