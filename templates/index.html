<!DOCTYPE html>
<html>
<head>
    <title>PDF → Video Converter</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #7f9cf5, #c084fc);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
        }

        input, textarea {
            width: 100%;
            margin-top: 8px;
            margin-bottom: 15px;
            padding: 8px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .progress {
            margin-top: 10px;
            height: 20px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #4f46e5;
            text-align: center;
            color: white;
        }

        video {
            width: 100%;
            margin-top: 15px;
        }

        .download {
            display: block;
            margin-top: 10px;
            text-align: center;
            background: green;
            color: white;
            padding: 10px;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>PDF → Video Converter</h2>

    <!-- IMPORTANT: name="images" -->
    <input type="file" id="images" name="file" multiple>
    <!-- narration -->
    <input type="text" name="durations" placeholder="e.g. 2,3,5">
    <textarea id="narration" name="narration" placeholder="Enter narration..."></textarea>

    <!-- audio (optional, backend not using but kept for UI same) -->
    <input type="file" id="audio" name="audio">

    <button onclick="startProcess()">✨ Create Video</button>

    <div class="progress">
        <div id="bar" class="progress-bar">0%</div>
    </div>

    <video id="video" controls></video>

    <a id="download" class="download" href="/download" style="display:none;">⬇ Download Video</a>
</div>

<script>
function startProcess() {
    const files = document.getElementById("images").files;
    const narration = document.getElementById("narration").value;
    const durations = document.querySelector('[name="durations"]').value;
    const audio = document.getElementById("audio").files[0];

    let formData = new FormData();

    // VERY IMPORTANT 👇
    for (let i = 0; i < files.length; i++) {
        formData.append("file", files[i]);  // must match backend
    }

    formData.append("narration", narration);
    formData.append("durations", durations);

    if (audio) {
        formData.append("audio", audio);
    }

    fetch("/start", {
        method: "POST",
        body: formData
    });

    // progress loop
    let interval = setInterval(() => {
        fetch("/progress")
        .then(res => res.json())
        .then(data => {
            let bar = document.getElementById("bar");
            bar.style.width = data.progress + "%";
            bar.innerText = data.progress + "%";

            if (data.progress >= 100) {
                clearInterval(interval);
                document.getElementById("download").style.display = "block";
            }
        });
    }, 1000);
}
</script>
</body>
</html>
