<!DOCTYPE html>
<html>
<head>
<title>PDF → Video Converter</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #667eea, #764ba2);
    text-align: center;
}

.container {
    background: white;
    width: 400px;
    margin: 40px auto;
    padding: 20px;
    border-radius: 10px;
}

input {
    width: 90%;
    margin: 10px;
    padding: 8px;
}

button {
    padding: 10px;
    background: #4facfe;
    border: none;
    color: white;
}

.progress {
    width: 100%;
    background: #eee;
}

.progress-bar {
    width: 0%;
    background: #4facfe;
    color: white;
}

video {
    width: 100%;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

<h2>🚀 PDF → Video Converter</h2>

<form id="form">

<p>Upload PDF</p>
<input type="file" name="file">

<p>Seconds per slide</p>
<input type="number" name="default_duration" value="3">

<p>Custom durations</p>
<input type="text" name="durations" placeholder="2,3,5">

<p>Background Audio</p>
<input type="file" name="audio">

<button type="button" onclick="startProcess()">Create Video</button>

</form>

<div class="progress">
<div id="bar" class="progress-bar">0%</div>
</div>

<video id="video" controls></video>

<a id="download" href="/download" style="display:none;">Download</a>

</div>

<script>
function startProcess() {

let formData = new FormData(document.getElementById("form"));

fetch("/start", {
    method: "POST",
    body: formData
});

let interval = setInterval(() => {

fetch("/progress")
.then(res => res.json())
.then(data => {

let bar = document.getElementById("bar");

bar.style.width = data.value + "%";
bar.innerHTML = data.value + "%";

if (data.value >= 100) {
clearInterval(interval);

document.getElementById("video").src = "/download";
document.getElementById("download").style.display = "block";
}

});

}, 1000);
}
</script>

</body>
</html>
