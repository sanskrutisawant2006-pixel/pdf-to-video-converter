<!DOCTYPE html>
<html>
<head>
<title>PDF → Video Converter</title>

<style>
body {
    text-align: center;
    font-family: Arial;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
}

.container {
    background: white;
    color: black;
    width: 420px;
    margin: 40px auto;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

input, textarea {
    width: 90%;
    padding: 8px;
    margin: 8px 0;
}

button {
    padding: 10px;
    width: 95%;
    background: #4facfe;
    border: none;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

.progress {
    width: 90%;
    background: #ddd;
    margin: 10px auto;
    border-radius: 10px;
}

.progress-bar {
    height: 20px;
    width: 0%;
    background: #00c6ff;
    border-radius: 10px;
    color: white;
    text-align: center;
}

video {
    width: 100%;
    height: auto;
    margin-top: 20px;
    border-radius: 10px;
    display: block;
}
</style>
</head>

<body>

<h1>🚀 PDF → Video Converter</h1>

<div class="container">

<form id="form">

<p>📄 Upload PDF</p>
<input type="file" name="pdf">

<p>⏱ Seconds per slide</p>
<input type="number" name="duration" value="3">

<p>⚙ Custom durations</p>
<input type="text" name="custom_durations" placeholder="2,3,4">

<p>🎤 Narration</p>
<textarea name="narration" placeholder="Enter narration..."></textarea>

<p>🎵 Background Audio</p>
<input type="file" name="audio">

<button type="button" onclick="startProcess()">✨ Create Video</button>

</form>

<div class="progress">
    <div id="bar" class="progress-bar">0%</div>
</div>

<video id="video" controls></video>

</div>

<script>
function startProcess() {

let formData = new FormData(document.getElementById("form"));

fetch("/start", {
    method: "POST",
    body: formData
});

let interval = setInterval(() => {

fetch("/progress")
.then(res => res.json())
.then(data => {

let bar = document.getElementById("bar");

bar.style.width = data.value + "%";
bar.innerHTML = data.value + "%";

if (data.value >= 100) {
clearInterval(interval);
document.getElementById("video").src = "/static/final.mp4";
}

});

}, 1000);
}
</script>

</body>
</html>
