<!DOCTYPE html>
<html>
<head>
<title>PDF → Video Converter</title>

<style>
body {
    text-align: center;
    font-family: Arial;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
}

/* main box */
.container {
    background: white;
    color: black;
    width: 420px;
    margin: 40px auto;
    padding: 20px;
    border-radius: 12px;
}

/* inputs */
input, textarea {
    width: 90%;
    padding: 8px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
}

/* button */
button {
    padding: 10px;
    width: 95%;
    background: linear-gradient(45deg, #4facfe, #00f2fe);
    border: none;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

/* loader */
#loader {
    display: none;
    position: fixed;
    z-index: 999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: #0f172a;
    color: white;
}

/* spinner */
.spinner {
    margin: 200px auto;
    border: 6px solid #ccc;
    border-top: 6px solid #00c6ff;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

/* video */
video {
    margin-top: 20px;
    width: 90%;
    border-radius: 10px;
}
</style>

<script>
function showLoader() {
    document.getElementById("loader").style.display = "block";
    document.getElementById("status").innerText = "Processing PDF...";
}
</script>

</head>

<body>

<h1>🚀 PDF → Video Converter</h1>

<div class="container">

<form method="POST" enctype="multipart/form-data" onsubmit="showLoader()">

<p>📄 Upload PDF</p>
<input type="file" name="pdf" required>

<p>⏱ Seconds per slide</p>
<input type="number" name="duration" value="3">

<p>⚙ Custom durations (optional)</p>
<input type="text" name="custom_durations" placeholder="2,3,4">

<p>🎤 Narration (Text-to-Speech)</p>
<textarea name="narration" placeholder="Enter narration..."></textarea>

<p>🎵 Background Audio</p>
<input type="file" name="audio">

<br>
<button type="submit">✨ Create Video</button>

</form>

<!-- RESULT -->
{% if message %}
<h2>{{ message }}</h2>

<video controls>
    <source src="{{ url_for('static', filename=video) }}" type="video/mp4">
</video>
{% endif %}

</div>

<!-- LOADER -->
<div id="loader">
    <h2 id="status">Processing Video... ⏳</h2>
    <div class="spinner"></div>
    <p>Please wait, this may take a few seconds</p>
</div>

</body>
</html>
